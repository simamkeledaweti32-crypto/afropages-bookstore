<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AfroPages Bookstore - Cape Town Stories</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f5f0;color:#222}
header{background:#1a1a2e;color:white;padding:15px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
header h1{font-size:20px}
header.controls{display:flex;gap:10px;align-items:center}
select,button,input{padding:8px 12px;border-radius:6px;border:1px solid #ccc}
button{background:#e94560;color:white;border:none;cursor:pointer;font-weight:bold}
button:hover{background:#c7364f}
.hero{background:#16213e;color:white;text-align:center;padding:30px 15px}
.hero h2{font-size:26px;margin-bottom:8px}
.search-bar{padding:15px;background:white;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.books{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:15px;padding:15px}
.card{background:white;border-radius:10px;padding:15px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.card h3{margin:8px 0;color:#16213e}
.card.price{color:#e94560;font-weight:bold;font-size:18px}
.low{color:red;font-weight:bold;font-size:12px;background:#ffe0e0;padding:3px 6px;border-radius:4px;display:inline-block}
.stock{color:green;font-size:12px}
.cart-panel{position:fixed;top:0;right:-100%;width:90%;max-width:380px;height:100%;background:white;box-shadow:-3px 0 10px rgba(0,0,0,0.3);z-index:1000;transition:0.3s;padding:15px;overflow-y:auto}
.cart-panel.open{right:0}
.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:999}
.overlay.show{display:block}
.login-box{max-width:400px;margin:20px auto;background:white;padding:20px;border-radius:10px;display:none}
.login-box.show{display:block}
.checkout{margin-top:15px;padding:15px;border:1px solid #ddd;border-radius:8px;background:#fafafa}
</style>
</head>
<body>
<header>
<div><h1>📚 AfroPages Bookstore</h1><small>Cape Town Stories for the World</small></div>
<div class="controls">
<select id="currency"><option value="ZAR">ZAR - R</option><option value="USD">USD - $</option></select>
<button onclick="toggleLogin()" id="loginBtn">Login</button>
<button onclick="openCart()">🛒 Cart <span id="cartCount">0</span></button>
</div>
</header>
<div class="hero">
<h2>Cape Town Stories for the World</h2>
<p>African literature delivered worldwide via DHL & Paxi</p>
<p style="margin-top:10px;font-size:13px">Demo Login: admin@afropages.co.za / admin123 OR any email / 1234</p>
</div>
<div class="search-bar">
<input type="text" id="search" placeholder="Search books..." onkeyup="renderBooks()" style="width:200px">
<select id="filterCat" onchange="renderBooks()"><option value="all">All Categories</option><option value="Folktales">Folktales</option><option value="History">History</option><option value="Cooking">Cooking</option></select>
</div>
<div id="loginBox" class="login-box">
<h3>Login - Secure Access</h3>
<input type="email" id="email" placeholder="Email" style="width:100%;margin:10px 0">
<input type="password" id="password" placeholder="Password" style="width:100%;margin:10px 0">
<button onclick="login()" style="width:100%">Login</button>
<p id="loginMsg" style="color:red;margin-top:10px;font-size:13px"></p>
<button onclick="logout()" style="width:100%;margin-top:10px;background:#666">Logout</button>
</div>
<div class="books" id="books"></div>
<div class="overlay" id="overlay" onclick="closeCart()"></div>
<div class="cart-panel" id="cartPanel">
<h2>Your Cart</h2>
<div id="cartItems"></div>
<div class="checkout">
<h4>Shipping:</h4>
<label><input type="radio" name="ship" value="400" checked onchange="renderCart()"> DHL Express - R400</label><br>
<label><input type="radio" name="ship" value="100" onchange="renderCart()"> Paxi Counter - R100</label><br>
<label><input type="radio" name="ship" value="0" onchange="renderCart()"> eBook Only - R0 Instant</label>
<h4 style="margin-top:10px">Payment:</h4>
<label><input type="radio" name="pay" value="paypal" checked> PayPal</label>
<label><input type="radio" name="pay" value="payfast"> PayFast</label>
<h3 style="margin-top:15px">Total: <span id="total">R0</span></h3>
<button onclick="checkout()" style="width:100%;margin-top:10px;padding:12px">Checkout & Get Receipt</button>
<div id="receipt" style="margin-top:15px;font-size:13px;background:white;padding:10px;border-radius:6px;display:none"></div>
</div>
<button onclick="closeCart()" style="width:100%;margin-top:10px;background:#666">Close</button>
</div>
<script>
let booksData=[
{id:1,title:"Xhosa Folktales",category:"Folktales",price:280,stock:12,image:"📖",desc:"Traditional Xhosa stories"},
{id:2,title:"District Six Memories",category:"History",price:350,stock:4,image:"🏘️",desc:"History of District Six"},
{id:3,title:"Cape Malay Cooking",category:"Cooking",price:320,stock:8,image:"🍛",desc:"Cape Malay recipes"},
{id:4,title:"Table Mountain Tales",category:"Folktales",price:250,stock:2,image:"⛰️",desc:"Legends of Table Mountain"},
{id:5,title:"Robben Island Stories",category:"History",price:380,stock:15,image:"🏝️",desc:"Stories from Robben Island"},
{id:6,title:"African Proverbs Collection",category:"Folktales",price:200,stock:0,image:"💬",desc:"Wise African proverbs"}
];
let cart=JSON.parse(localStorage.getItem('cart')||'[]');
let user=localStorage.getItem('user');
function renderBooks(){
 let q=document.getElementById('search').value.toLowerCase();
 let cat=document.getElementById('filterCat').value;
 let cur=document.getElementById('currency').value;
 let filtered=booksData.filter(b=>{return (b.title.toLowerCase().includes(q)||b.desc.toLowerCase().includes(q))&&(cat==='all'||b.category===cat)});
 let html='';
 filtered.forEach(b=>{
  let displayPrice=cur==='USD'?'$'+(b.price/18).toFixed(2):'R'+b.price;
  let stockLabel=b.stock===0?'<span class="low">OUT OF STOCK</span>':b.stock<=4?`<span class="low">Low Stock ${b.stock}!</span>`:`<span class="stock">${b.stock} in stock</span>`;
  html+=`<div class="card"><div style="font-size:40px;text-align:center">${b.image}</div><h3>${b.title}</h3><small>${b.category} - ${b.desc}</small><br>${stockLabel}<div class="price">${displayPrice}</div><button onclick="addToCart(${b.id})" ${b.stock===0?'disabled style="background:#999"':''}>${b.stock===0?'Out of Stock':'Add to Cart'}</button></div>`;
 });
 document.getElementById('books').innerHTML=html||'<p style="padding:20px">No books found</p>';
 updateCartCount();
}
function addToCart(id){
 let book=booksData.find(b=>b.id===id);
 if(book.stock<=0){alert('Out of stock! Stock management working!');return;}
 let item=cart.find(c=>c.id===id);
 if(item){if(item.qty<book.stock)item.qty++;else{alert('Only '+book.stock+' in stock!');return;}}
 else cart.push({...book,qty:1});
 localStorage.setItem('cart',JSON.stringify(cart));
 renderBooks();renderCart();alert(book.title+' added!');
}
function updateCartCount(){document.getElementById('cartCount').innerText=cart.reduce((s,i)=>s+i.qty,0);}
function openCart(){document.getElementById('cartPanel').classList.add('open');document.getElementById('overlay').classList.add('show');renderCart();}
function closeCart(){document.getElementById('cartPanel').classList.remove('open');document.getElementById('overlay').classList.remove('show');}
function renderCart(){
 let cur=document.getElementById('currency').value;
 let ship=parseInt(document.querySelector('input[name="ship"]:checked')?.value||0);
 let html='';let sub=0;
 cart.forEach((c,i)=>{
  let price=cur==='USD'?(c.price/18).toFixed(2):c.price;
  let symbol=cur==='USD'?'$':'R';
  sub+=c.price*c.qty;
  html+=`<div style="display:flex;justify-content:space-between;margin:8px 0;border-bottom:1px solid #eee;padding-bottom:5px"><div>${c.title} x${c.qty}<br><small>${symbol}${price}</small></div><button onclick="removeItem(${i})" style="background:#999;padding:3px 8px">X</button></div>`;
 });
 document.getElementById('cartItems').innerHTML=html||'Cart empty';
 let total=sub+ship;
 let displayTotal=cur==='USD'?'$'+(total/18).toFixed(2):'R'+total;
 let displayShip=cur==='USD'?'$'+(ship/18).toFixed(2):'R'+ship;
 document.getElementById('total').innerText=displayTotal+' (Shipping: '+displayShip+')';
}
function removeItem(i){cart.splice(i,1);localStorage.setItem('cart',JSON.stringify(cart));renderCart();updateCartCount();}
function checkout(){
 if(cart.length===0){alert('Cart empty!');return;}
 let ship=document.querySelector('input[name="ship"]:checked').parentElement.innerText;
 let pay=document.querySelector('input[name="pay"]:checked').value;
 let total=document.getElementById('total').innerText;
 let receipt=`<h4>🧾 Receipt - AfroPages</h4>Customer: ${localStorage.getItem('user')||'Guest'}<br>Date: ${new Date().toLocaleString()}<br><br>${cart.map(c=>`${c.title} x${c.qty} - R${c.price*c.qty}`).join('<br>')}<br><br>${ship}<br>Payment: ${pay}<br><b>${total}</b><br><br>${document.querySelector('input[name="ship"]:checked').value==='0'?'📥 eBook Download: <a href="#" onclick="alert(\'eBook downloaded!\')">Download PDF</a> (R0 FREE)':'📦 Physical books will be shipped!'}<br><br>Thank you!`;
 document.getElementById('receipt').innerHTML=receipt;
 document.getElementById('receipt').style.display='block';
 cart.forEach(c=>{let b=booksData.find(x=>x.id===c.id);if(b)b.stock-=c.qty;});
 cart=[];localStorage.setItem('cart',JSON.stringify(cart));localStorage.setItem('books',JSON.stringify(booksData));
 renderBooks();updateCartCount();alert('Checkout successful!');
}
function toggleLogin(){let box=document.getElementById('loginBox');box.classList.toggle('show');if(user)document.getElementById('loginMsg').innerText='Logged in as '+user;}
function login(){
 let email=document.getElementById('email').value.trim();
 let pass=document.getElementById('password').value.trim();
 let msg=document.getElementById('loginMsg');
 if(!email||!pass){msg.innerText='Enter email and password! (Validation working)';return;}
 if((email==='admin@afropages.co.za'&&pass==='admin123')||pass==='1234'||pass==='admin123'){
  localStorage.setItem('user',email);user=email;msg.style.color='green';msg.innerText='Login successful! Welcome '+email;
  document.getElementById('loginBtn').innerText='👤 '+email.split('@')[0];
  setTimeout(()=>{document.getElementById('loginBox').classList.remove('show')},1000);
 }else{msg.style.color='red';msg.innerText='Invalid credentials! Hint: use 1234. Security works!';}
}
function logout(){localStorage.removeItem('user');user=null;document.getElementById('loginBtn').innerText='Login';document.getElementById('loginMsg').innerText='Logged out!';}
document.getElementById('currency').addEventListener('change',()=>{renderBooks();renderCart();});
window.onload=()=>{
 let saved=localStorage.getItem('books');if(saved)booksData=JSON.parse(saved);
 if(user)document.getElementById('loginBtn').innerText='👤 '+user.split('@')[0];
 renderBooks();renderCart();
}
</script>
</body>
</html>
