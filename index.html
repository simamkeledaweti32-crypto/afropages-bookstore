<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AfroPages - Cape Town Global Bookstore</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{font-family:Segoe UI,sans-serif}
.hero{background:#1a1a2e;color:white;padding:40px 0;text-align:center}
.book-card{box-shadow:0 4px 12px rgba(0,0,0,.1);border:none}
.low-stock{background:#ff4757;color:white;padding:2px 8px;border-radius:10px;font-size:12px}
.price{color:#FF6B35;font-weight:bold}
</style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark sticky-top">
<div class="container">
<b>📚 AfroPages</b>
<div class="d-flex gap-2">
<select id="curr" class="form-select form-select-sm" style="width:90px"><option>ZAR</option><option>USD</option></select>
<button class="btn btn-warning btn-sm" data-bs-toggle="modal" data-bs-target="#loginModal">Login</button>
<button class="btn btn-light btn-sm" onclick="viewCart()">🛒 <span id="cnt">0</span></button>
</div>
</div>
</nav>
<div class="hero"><h2>Cape Town Stories for the World</h2><p>Physical via DHL R400 / Paxi R100 + Instant eBook R0 | PayPal PayFast</p></div>
<div class="container my-3">
<input id="search" class="form-control mb-2" placeholder="Search books..." onkeyup="filterBooks()">
<div class="row" id="bookList"></div>
</div>
<div class="modal fade" id="loginModal"><div class="modal-dialog"><div class="modal-content"><div class="modal-body">
<h5>Login / Register - Validation</h5>
<div id="err" class="alert alert-danger d-none"></div>
<input id="email" class="form-control mb-2" placeholder="Email must have @" type="email">
<input id="pass" class="form-control mb-2" placeholder="Password min 6 chars" type="password">
<button class="btn btn-dark w-100" onclick="login()">Login / Register</button>
<div id="ok" class="alert alert-success mt-2 d-none"></div>
</div></div></div></div>
<div class="modal fade" id="cartModal"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5>Cart & Receipt</h5></div><div class="modal-body" id="cartBody"></div><div class="modal-footer"><div class="w-100"><p>Total: <b id="total">R0</b></p><select id="ship" class="form-select mb-2"><option value="0">eBook Free</option><option value="100">Paxi R100</option><option value="400">DHL R400</option></select><button class="btn btn-warning w-100" onclick="checkout()">Pay with PayPal / PayFast</button><div id="receipt" class="mt-2"></div></div></div></div></div></div>
<script>
let books=[{id:1,t:"Xhosa Folktales for Children",c:"folktale",p:280,s:12,ty:"Physical+eBook"},{id:2,t:"District Six Memories",c:"history",p:350,s:4,ty:"Physical"},{id:3,t:"Cape Malay Cooking Heritage",c:"culture",p:320,s:20,ty:"Physical+eBook"},{id:4,t:"Robben Island Voices",c:"history",p:380,s:3,ty:"Physical+eBook"},{id:5,t:"Table Mountain Kids Adventure",c:"kids",p:250,s:15,ty:"eBook"},{id:6,t:"Bo-Kaap Colours",c:"culture",p:300,s:8,ty:"Physical"}];
let cart=[],logged=false,curr="ZAR",rate=18.5;
function render(list=books){let h="";list.forEach(b=>{let price=curr=="ZAR"?`R${b.p}`:`$${(b.p/rate).toFixed(2)}`;let low=b.s<5?`<span class=low-stock>Low Stock ${b.s}!</span>`:`${b.s} in stock`;h+=`<div class="col-6 col-md-4 mb-3"><div class="card book-card p-2 h-100"><h6>${b.t}</h6><small>${b.ty}</small><br><span class=price>${price}</span><br><small>${low}</small><br><button class="btn btn-dark btn-sm w-100 mt-1" onclick="addCart(${b.id})">Add to Cart</button></div></div>`});document.getElementById("bookList").innerHTML=h;}
function addCart(id){if(!logged){alert("Please login first! Validation required");return;}let b=books.find(x=>x.id==id);if(b.s<=0)return alert("Out of stock! Stock management");b.s--;let it=cart.find(x=>x.id==id);if(it)it.q++;else cart.push({...b,q:1});document.getElementById("cnt").innerText=cart.reduce((a,c)=>a+c.q,0);if(b.s<5)alert(`Low stock alert! ${b.t} only ${b.s} left!`);render();}
function viewCart(){let body=document.getElementById("cartBody");if(!cart.length)body.innerHTML="Cart empty - Checkout blocked (Error handling)";else{let html="<table class=table><tr><th>Book</th><th>Qty</th></tr>";cart.forEach(c=>html+=`<tr><td>${c.t} (${c.ty})</td><td>${c.q}</td></tr>`);html+="</table>";body.innerHTML=html;let tot=cart.reduce((a,c)=>a+c.p*c.q,0);document.getElementById("total").innerText=curr=="ZAR"?`R${tot}`:`$${(tot/rate).toFixed(2)}`;}new bootstrap.Modal(document.getElementById("cartModal")).show();}
function login(){let e=document.getElementById("email").value,p=document.getElementById("pass").value,er=document.getElementById("err"),ok=document.getElementById("ok");er.classList.add("d-none");if(!e.includes("@")||!e.includes(".")){er.innerText="Error handling: Invalid email format!";er.classList.remove("d-none");return;}if(p.length<6){er.innerText="Error handling: Password min 6 chars! Data validation failed";er.classList.remove("d-none");return;}logged=true;localStorage.setItem("token",btoa(e+Date.now()));ok.innerText=`Authentication success! Token stored. Welcome ${e}`;ok.classList.remove("d-none");setTimeout(()=>bootstrap.Modal.getInstance(document.getElementById("loginModal")).hide(),1000);}
function checkout(){if(!cart.length)return alert("Error: Cart empty! Cannot checkout");let ship=parseInt(document.getElementById("ship").value);let tot=cart.reduce((a,c)=>a+c.p*c.q,0)+ship;let id="AFRO"+Date.now();let email=document.getElementById("email").value;document.getElementById("receipt").innerHTML=`<div class="alert alert-success"><b>✅ Receipt #${id}</b><br>Email: ${email}<br>Total: R${tot}<br>Payment: PayPal Sandbox Success<br>DHL Tracking: DHL${id}<br>${cart.some(c=>c.ty.includes("eBook"))?'<a href="#">📥 Download eBook Instant</a>':''}<br>Stock management updated</div>`;cart=[];document.getElementById("cnt").innerText=0;}
function filterBooks(){let q=document.getElementById("search").value.toLowerCase();render(books.filter(b=>b.t.toLowerCase().includes(q)||b.c.includes(q)));}
document.getElementById("curr").addEventListener("change",e=>{curr=e.target.value;render();});
render();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
